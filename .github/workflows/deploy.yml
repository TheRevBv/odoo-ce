name: Deploy Odoo to VPS

on:
  push:
    branches: [pre-prod, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'preprod' }}

    steps:
      - uses: actions/checkout@v4

      - name: Decode SSH key (from base64 secret)
        id: sshkey
        shell: bash
        run: |
          set -euo pipefail
          echo "key<<EOF" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d | tr -d '\r' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ✅ Si esto falla, NO es la llave. Es host/puerto/DNS/firewall externo.
      - name: Check TCP connectivity to VPS SSH
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          echo "Testing TCP to $HOST:$PORT"
          timeout 10 bash -lc "cat < /dev/null > /dev/tcp/$HOST/$PORT"
          echo "TCP OK"

      - name: Ensure target dir exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ steps.sshkey.outputs.key }}
          timeout: 120s
          command_timeout: 10m
          script: |
            set -e
            sudo mkdir -p /opt/odoo
            # chown estable (no depende de $USER)
            sudo chown -R "${USER:-${LOGNAME:-$(whoami)}}":"${USER:-${LOGNAME:-$(whoami)}}" /opt/odoo 2>/dev/null || true

      - name: Copy compose to VPS (flatten to /opt/odoo/docker-compose.yml)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ steps.sshkey.outputs.key }}
          timeout: 120s
          source: "deploy/docker-compose.yml"
          target: "/opt/odoo"
          strip_components: 1
          overwrite: true

      - name: Deploy (pull + up)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ steps.sshkey.outputs.key }}
          timeout: 120s
          command_timeout: 15m
          envs: GH_USER,GHCR_TOKEN
          script: |
            set -e

            ENV_FILE="/opt/odoo/.env"
            COMPOSE_FILE="/opt/odoo/docker-compose.yml"

            if [ ! -f "$ENV_FILE" ]; then
              echo "No existe $ENV_FILE. Cópialo desde deploy/.env.example y rellena valores."
              exit 1
            fi

            # sanity
            docker compose version

            docker logout ghcr.io >/dev/null 2>&1 || true

            if [ -n "${GH_USER:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin || {
                echo "WARN: docker login a GHCR falló, continuaré anónimo (si la imagen es pública)."
                docker logout ghcr.io >/dev/null 2>&1 || true
              }
            fi

            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" pull
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d
            docker image prune -f

      - name: Notify deployment success (PR only)
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const envName = context.ref === 'refs/heads/main' ? 'Production' : 'Pre-production';
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Deployment to **${envName}** successful!`
            });
