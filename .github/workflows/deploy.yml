name: Deploy Odoo to VPS

on:
  push:
    branches: [pre-prod, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'preprod' }}

    steps:
      - uses: actions/checkout@v4

      - name: Decode SSH key (from base64 secret)
        id: sshkey
        shell: bash
        run: |
          set -euo pipefail
          echo "key<<EOF" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d | tr -d '\r' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Ensure target dir exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ steps.sshkey.outputs.key }}
          script: |
            sudo mkdir -p /opt/odoo || mkdir -p /opt/odoo
            sudo chown -R $USER:$USER /opt/odoo 2>/dev/null || true

      - name: Copy compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ steps.sshkey.outputs.key }}
          source: "deploy/docker-compose.yml"
          target: "/opt/odoo"

      - name: Deploy (pull + up)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ steps.sshkey.outputs.key }}
          envs: GH_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/odoo

            if [ ! -f .env ]; then
              echo "No existe /opt/odoo/.env. Cópialo desde deploy/.env.example y rellena valores."
              exit 1
            fi

            # Debug seguro (no imprime valores)
            echo "GH_USER set? $([ -n "$GH_USER" ] && echo yes || echo no)"
            echo "GHCR_TOKEN set? $([ -n "$GHCR_TOKEN" ] && echo yes || echo no)"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
            docker compose --env-file .env -f docker-compose.yml pull
            docker compose --env-file .env -f docker-compose.yml up -d
            docker image prune -f

      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const env = github.ref_name === 'main' ? 'Production' : 'Pre-production';
            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Deployment to **${env}** successful!`
            });
