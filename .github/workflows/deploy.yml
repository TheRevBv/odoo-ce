name: Deploy Odoo to VPS

on:
  push:
    branches: [pre-prod, main]
    paths:
      - ".github/workflows/deploy.yml"
      - "deploy/docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'preprod' }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/

      - name: Decode SSH key (from base64 secret)
        id: sshkey
        shell: bash
        run: |
          set -euo pipefail
          echo "key<<EOF" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d | tr -d '\r' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ steps.sshkey.outputs.key }}

      - name: Add known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          HOST="${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          for i in 1 2 3; do
            if ssh-keyscan -T 5 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "known_hosts updated for $HOST:$PORT"
              exit 0
            fi
            echo "ssh-keyscan failed (attempt $i/3), retrying..."
            sleep 2
          done
          echo "::warning::Could not fetch host key for $HOST:$PORT. SSH will continue with StrictHostKeyChecking=accept-new."

      - name: Ensure target dir exists
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
          ssh $SSH_OPTS "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo mkdir -p /opt/odoo && sudo chown -R '${{ secrets.VPS_USER }}':'${{ secrets.VPS_USER }}' /opt/odoo && sudo chmod 775 /opt/odoo"

      - name: Copy compose file to VPS
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
          ssh $SSH_OPTS "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/odoo && if [ -f docker-compose.yml ]; then cp docker-compose.yml docker-compose.yml.backup-\$(date +%Y%m%d-%H%M%S); fi"
          scp -P "${{ secrets.VPS_PORT }}" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 deploy/docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/odoo/docker-compose.yml"

      - name: Deploy (pull + up)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USER: ${{ secrets.GH_USER || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" bash -s "$GHCR_TOKEN" "$GHCR_USER" << 'SCRIPT'
            set -euo pipefail
            GHCR_TOKEN="$1"
            GHCR_USER="$2"
            ENV_FILE="/opt/odoo/.env"
            COMPOSE_FILE="/opt/odoo/docker-compose.yml"

            cd /opt/odoo

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing $ENV_FILE. Create it from deploy/.env.example and fill values."
              exit 1
            fi

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-}" --password-stdin
            else
              echo "GHCR_TOKEN is empty; pull may fail for private images."
            fi

            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" pull
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans
            docker image prune -f >/dev/null 2>&1 || true
          SCRIPT
