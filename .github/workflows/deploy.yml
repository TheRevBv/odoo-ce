name: Deploy Odoo to VPS

on:
  push:
    branches: [pre-prod, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'preprod' }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE="${GITHUB_WORKSPACE}/.vps_key"
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Debug key file exists
        run: |
          ls -la "${GITHUB_WORKSPACE}/.vps_key"
          head -n 1 "${GITHUB_WORKSPACE}/.vps_key" | sed 's/./*/g'

      - name: Copy compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key_path: ${{ env.KEY_FILE }}
          source: "deploy/docker-compose.yml"
          target: "/opt/odoo"

      - name: Deploy (pull + up)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key_path: ${{ env.KEY_FILE }}
          script: |
            set -e
            sudo mkdir -p /opt/odoo
            cd /opt/odoo

            if [ ! -f .env ]; then
              echo "No existe /opt/odoo/.env. Cópialo desde deploy/.env.example y rellena valores."
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
            docker compose --env-file .env -f docker-compose.yml pull
            docker compose --env-file .env -f docker-compose.yml up -d
            docker image prune -f

      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const env = github.ref_name === 'main' ? 'Production' : 'Pre-production';
            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Deployment to **${env}** successful!`
            });
