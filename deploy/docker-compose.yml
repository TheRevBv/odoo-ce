services:
  odoo:
    image: ${ODOO_IMAGE}:${ODOO_TAG}
    env_file:
      - ./.env
    command:
      - odoo
      - --proxy-mode
      - --db_host=${POSTGRES_HOST}
      - --db_port=${POSTGRES_PORT}
      - --db_user=${POSTGRES_USER}
      - --db_password=${POSTGRES_PASSWORD}
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/var/lib/odoo/addons/19.0,/mnt/extra-addons
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
      - "127.0.0.1:${ODOO_LONGPOLL_PORT:-8072}:8072"
    volumes:
      - odoo_data:/var/lib/odoo
    restart: unless-stopped
    networks:
      - shared_backend

volumes:
  odoo_data:

networks:
  shared_backend:
    external: true